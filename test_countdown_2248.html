<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Countdown — 22:48</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#182b4e,#030611 68%);color:#fff;font-family:Arial,sans-serif;text-align:center;padding:20px}
.card{width:min(92vw,420px);padding:34px 22px;border-radius:26px;background:rgba(5,12,28,.9);border:1px solid #397db8;box-shadow:0 0 40px rgba(0,130,255,.2)}.star{font-size:40px}h1{font-size:23px;letter-spacing:1.5px;margin:10px 0}p{color:#aab9cf;font-size:14px}.timer{display:flex;gap:9px;justify-content:center;margin:25px 0}.box{min-width:90px;padding:17px 8px;background:#101d35;border-radius:15px;border:1px solid #243957}.n{font-size:30px;font-weight:800}.l{font-size:9px;color:#91a4bf;letter-spacing:1px;margin-top:6px}a{display:none;margin-top:10px;padding:13px 22px;border-radius:13px;background:white;color:#06101d;text-decoration:none;font-weight:800}
</style></head><body><div class="card"><div class="star">✨</div><h1>WISHES OPEN AT 10:48 PM</h1><p>TEST COUNTDOWN</p>
<div class="timer"><div class="box"><div class="n" id="m">00</div><div class="l">MINUTES</div></div><div class="box"><div class="n" id="s">00</div><div class="l">SECONDS</div></div></div>
<p id="status">Waiting for 10:48 PM IST…</p><a id="open" href="https://rebeldarling-001.github.io/theju-birthday/">OPEN WISH ✨</a></div>
<script>
const targetHour=22,targetMinute=48,targetSecond=0;
function istParts(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kolkata',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hour12:false}).formatToParts(new Date());let o={};p.forEach(x=>o[x.type]=+x.value);return o;}
function targetMs(){let p=istParts();let t=Date.UTC(p.year,p.month-1,p.day,targetHour,targetMinute,targetSecond)-19800000;if(Date.now()>=t)t+=86400000;return t;}
let target=targetMs();
function tick(){let d=target-Date.now();if(d<=0){document.getElementById('m').textContent='00';document.getElementById('s').textContent='00';document.getElementById('status').textContent="It’s time! Opening…";document.getElementById('open').style.display='inline-block';setTimeout(()=>location.replace('https://rebeldarling-001.github.io/theju-birthday/'),300);return;}let x=Math.floor(d/1000);document.getElementById('m').textContent=String(Math.floor(x/60)).padStart(2,'0');document.getElementById('s').textContent=String(x%60).padStart(2,'0');}
tick();setInterval(tick,250);
</script></body></html>
